name: Fork maintenance checks

on:
  push:
    branches: [main, dev, 'feat/custom-development', 'sync/**']
    paths:
      - 'fork/**'
      - '.github/workflows/fork-maintenance.yml'
  pull_request:
    paths:
      - 'fork/**'
      - '.github/workflows/fork-maintenance.yml'

permissions:
  contents: read

concurrency:
  group: fork-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Test fork maintenance commands
        run: node --test fork/maintain.test.mjs
